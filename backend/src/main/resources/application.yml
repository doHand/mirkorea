spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:wms_pro}
    username: ${DB_USER:wms_user}
    password: ${DB_PASSWORD:wms_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_batch_fetch_size: 100
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${PORT:4000}

jwt:
  # JWT_SECRET must be set — no default. Use: openssl rand -hex 32
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600}         # 1h (seconds) — was 24h
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800}   # 7d — was 30d

springdoc:
  api-docs:
    path: /api/docs
    # 프로덕션에서 SWAGGER_ENABLED=false 환경변수로 비활성화
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    path: /api/swagger-ui
    tags-sorter: alpha
    enabled: ${SWAGGER_ENABLED:false}

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000}

logging:
  level:
    com.wmspro: INFO
    org.springframework.security: WARN

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
  logging:
    level:
      com.wmspro: DEBUG

# dev 프로필에서는 Swagger 활성화 (JWT_SECRET도 .env에서 설정 필요)
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
